min_version: 2.1.10

pre-commit:
  parallel: false
  commands:
    biome:
      run: corepack npm run quality:staged
      stage_fixed: true
    policy:
      run: corepack npm run quality:policy
    docs:
      run: corepack npm run docs:check
    skills:
      run: corepack npm run skills:validate
    secrets:
      run: node scripts/check-secrets.mjs --staged
    whitespace:
      run: git diff --cached --check

pre-push:
  commands:
    verify:
      run: corepack npm run check
