name: "OWASP ZAP Baseline Security Scan"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read
  issues: write

concurrency:
  group: zap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap_scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm run build

      - name: Start ephemeral test server
        run: |
          corepack pnpm --filter @agent-harness/server run start &
          sleep 5

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@52c50259e86016c68e2193b22e1b4b1a41dbad76 # v0.14.0
        with:
          target: "http://localhost:3001"
          network_name: "host"
          issue_title: "OWASP ZAP Baseline Security Alert"
          # ZAP WARN results remain visible for issue-based triage. FAIL results
          # (including High alerts) fail this check and cannot be silently accepted.
          cmd_options: "-I"
          fail_action: true
