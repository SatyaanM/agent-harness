packages:
  - "packages/*"

confirmModulesPurge: false
minimumReleaseAge: 0

catalog:
  # Tooling & Compilers
  "@biomejs/biome": "2.5.5"
  "@commitlint/cli": "^19.8.0"
  "@commitlint/config-conventional": "^19.8.0"
  "@playwright/test": "^1.50.1"
  "@types/express": "^4.17.21"
  "@types/node": "^20.17.0"
  "@vitest/coverage-v8": "4.1.10"
  "@vitest/ui": "4.1.10"
  knip: "^5.45.0"
  lefthook: "2.1.10"
  turbo: "^2.x"
  typescript: "^5.x"
  vitest: "4.1.10"

  # Core & Shared Contracts
  zod: "^3.25.76"
  fs-extra: "^11.x"
  "@types/fs-extra": "^11.x"
  gray-matter: "^4.x"

  # React 19 Frontend Stack
  react: "^19.0.0"
  react-dom: "^19.0.0"
  "@types/react": "^19.0.0"
  "@types/react-dom": "^19.0.0"
  next: "^16.3.0"
  tailwindcss: "^3.4.17"
  lucide-react: "^0.577.0"
  clsx: "^2.1.1"
  tailwind-merge: "^3.6.0"

overrides:
  "@excalidraw/excalidraw>nanoid": "^3.3.17"
  "@excalidraw/mermaid-to-excalidraw>nanoid": "^5.1.16"
  dompurify: "^3.4.13"
  lodash-es: "^4.18.1"
  react: "catalog:"
  react-dom: "catalog:"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"

peerDependencyRules:
  ignoreMissing:
    - "@types/react"
    - react
    - react-dom
  allowAny:
    - "@types/react"
    - "@types/react-dom"

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp

allowBuilds:
  esbuild: true
  lefthook: true
